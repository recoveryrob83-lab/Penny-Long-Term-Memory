[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lifeos-dashboard-v2-server"
version = "0.1.0"
description = "Slice One local advisory courier contracts and server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.116,<1.0", "uvicorn[standard]>=0.35,<1.0"]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9.0", "httpx>=0.28,<1.0"]

[tool.setuptools.packages.find]
include = ["lifeos_v2*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
